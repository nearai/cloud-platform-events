[package]
name = "cloud-platform-events"
version = "2.0.0"
edition = "2021"
description = "Usage message envelope and payload types shared by cloud-platform producers and consumer"
license-file = "LICENSE"
repository = "https://github.com/nearai/cloud-platform-events"
publish = false

[dependencies]
time = { version = "0.3.47", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = "1"
