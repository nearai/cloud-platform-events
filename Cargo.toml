[package]
name = "cloud-platform-events"
version = "2.1.0"
edition = "2021"
description = "Usage message envelope and payload types shared by cloud-platform producers and consumer"
license-file = "LICENSE"
repository = "https://github.com/nearai/cloud-platform-events"
publish = false

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = "1"
